<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keeper, coming soon</title>
<meta name="description" content="Keep her. Keep him. Keep mum happy. Keep your mates close. Keep your team valued. Keep your clients. Keep your people. Dates remembered, gifts sorted, surprises handled. Coming soon to keeper.gifts.">
<meta name="theme-color" content="#fafafc">
<!-- A pasted link is often the first time anyone sees keeper. Absolute URLs, because every
     unfurler fetches the image from its own server. og.png is rendered by ../render.mjs. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="keeper">
<meta property="og:title" content="keeper, coming soon">
<meta property="og:description" content="Keep her. Keep him. Keep mum happy. Keep your mates close. Keep your team valued. Keep your clients. Keep your people.">
<meta property="og:url" content="https://keeper.gifts/">
<meta property="og:image" content="https://keeper.gifts/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="keeper. Coming soon.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="keeper, coming soon">
<meta name="twitter:description" content="Keep her. Keep him. Keep mum happy. Keep your mates close. Keep your team valued. Keep your clients. Keep your people.">
<meta name="twitter:image" content="https://keeper.gifts/og.png">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="canonical" href="https://keeper.gifts/">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap">
<style>
/*
 * Marshmallow (packages/tokens/src/languages.ts), inlined so this folder hosts anywhere with
 * no generator behind it. Paper ground, ink type, violet action. The only dark thing on the
 * page is the phone's screen, because the photographs are.
 */
:root{
  --bg:#fafafc; --bg-deep:#f3f1f8; --surface:#e6dcff; --raised:#ffffff; --tint-deep:#d9ccff;
  --ink:#26212e; --ink-dim:#443c4f; --ink-muted:#625a6e; --ink-faint:#736b7e;
  --cta:#5b3fa6; --cta-pressed:#4a3190; --cta-ink:#ffffff;
  --status:#ffe45c; --lilac:#c9b8fa; --hair:#e6dcff;
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --display:'Poppins','Archivo',system-ui,sans-serif;
  --enter:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh}
a{color:var(--cta);text-decoration:none}
input,button{font-family:inherit}

/* ── the word, top left, as the logo already is ── */
header{padding:22px 28px;display:flex;justify-content:space-between;align-items:center}
.wordmark{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.soon{font-size:12.5px;font-weight:700;color:var(--ink);background:var(--status);border-radius:999px;padding:6px 12px}

/* ── the phone, in the middle ── */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:8px 20px 40px}
.phone{margin-bottom:30px}
.phone{
  position:relative;width:min(390px,92vw);aspect-ratio:390/844;
  border-radius:56px;background:#0a0908;padding:12px;
  box-shadow:0 30px 80px rgba(38,33,46,.28),0 0 0 2px #2b2630 inset;
  animation:pop .8s var(--enter) both;
}
@media(max-height:900px){.phone{width:min(360px,92vw)}}
@media(max-height:760px){.phone{width:min(320px,92vw);border-radius:48px}}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#0a0908;color:#fff}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;opacity:0;
  transition:opacity .9s ease;will-change:opacity}
.screen img.on{opacity:1}
/* Dark from the bottom so the words read, whatever the photograph is doing. */
.screen::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,9,8,.45) 0%,rgba(10,9,8,0) 26%,rgba(10,9,8,0) 42%,rgba(10,9,8,.86) 72%,#0a0908 100%)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:34%;height:30px;border-radius:999px;background:#000;z-index:3}
.status{position:absolute;top:18px;left:28px;right:28px;display:flex;justify-content:space-between;font-size:14px;font-weight:600;z-index:3}
.status span:last-child{letter-spacing:.06em}
.app{position:absolute;top:76px;left:0;right:0;z-index:3;display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.03em;line-height:1}

.copy{position:absolute;left:24px;right:24px;bottom:120px;z-index:3}
.keep{font-family:var(--display);font-weight:800;font-size:clamp(44px,15.5cqw,64px);line-height:.95;letter-spacing:-.03em;color:#fff;margin:0}
.who{font-family:var(--display);font-weight:800;font-size:clamp(34px,12.5cqw,52px);line-height:1;letter-spacing:-.025em;color:var(--lilac);margin:4px 0 0;min-height:1em;white-space:nowrap}
.who.two{font-size:clamp(28px,10cqw,42px);white-space:normal;line-height:1.02}
/* Long relationship phrases stay on one line while preserving the visual weight of KEEP. */
.who.compact{font-size:clamp(27px,9.2cqw,38px);white-space:nowrap;line-height:1}
.caret{display:inline-block;width:.08em;height:.9em;background:var(--lilac);margin-left:.06em;vertical-align:-.08em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tag{font-family:var(--sans);font-size:14px;line-height:1.4;color:rgba(255,255,255,.82);margin:14px 0 0;opacity:0;transition:opacity .5s ease;max-width:26ch}
.tag.on{opacity:1}
.phone{container-type:inline-size}

/* Under the word, 16px below it, and exactly as wide as it: the script sets the width from the word. */
.dots{display:flex;justify-content:space-between;margin-top:12px;width:88px}
.dots button{width:7px;height:7px;border-radius:999px;border:0;padding:0;background:rgba(255,255,255,.3);cursor:pointer;transition:background .3s,transform .3s}
.dots button.on{background:var(--lilac);transform:scale(1.3)}
.cta{position:absolute;left:24px;right:24px;bottom:34px;z-index:3;display:block;text-align:center;background:var(--cta);color:#fff;
  border:0;border-radius:999px;padding:12px;font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer}
.cta:active{background:var(--cta-pressed)}

/* ── under the phone ── */
.form{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(440px,92vw)}
.form input{flex:1 1 200px;min-width:0;padding:14px 18px;border-radius:999px;border:1.5px solid var(--hair);background:var(--raised);color:var(--ink);font-size:15px;outline:none}
.form input:focus-visible{border-color:var(--cta);box-shadow:0 0 0 3px rgba(91,63,166,.15)}
.form button{border:0;border-radius:999px;background:var(--cta);color:#fff;padding:14px 22px;font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer}
.noted{font-size:15px;font-weight:600;color:var(--cta);animation:pop .4s var(--enter) both}
.line{font-size:13.5px;color:var(--ink-faint);margin:0;text-align:center}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.phone,.noted{animation:none}.caret{animation:none}.screen img{transition:none}}

footer{padding:18px 28px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-faint);flex-wrap:wrap;gap:10px}
footer a{color:var(--ink-faint)}
</style>
</head>
<body>

<header>
  <span class="wordmark">keeper</span>
  <span class="soon">Coming soon</span>
</header>

<main>
  <div class="phone" role="img" aria-label="keeper. Keep her. Keep him. Keep mum happy. Keep your mates close. Keep your team valued. Keep your clients. Keep your people.">
    <div class="screen">
      <!-- One img per scene, crossfaded. The first is the signature photograph from the home page. -->
      <img src="/scene-her.jpg" alt="" class="on" data-scene="0" style="object-position:74% 30%">
      <img src="/scene-him.jpg" alt="" data-scene="1">
      <img src="/scene-mum.jpg" alt="" data-scene="2">
      <img src="/scene-mates.jpg" alt="" data-scene="3">
      <img src="/scene-team.jpg" alt="" data-scene="4">
      <img src="/scene-clients.jpg" alt="" data-scene="5">
      <img src="/scene-people.jpg" alt="" data-scene="6">
      <div class="island"></div>
      <div class="status"><span>9:41</span><span>●●●</span></div>
      <div class="app"><span id="word">keeper</span><div class="dots" id="dots" aria-hidden="true"></div></div>
      <div class="copy">
        <p class="keep">keep</p>
        <p class="who" id="who" aria-live="off"><span id="typed">her.</span><span class="caret" aria-hidden="true"></span></p>
        <p class="tag" id="tag">Dates remembered. Gifts sorted. Random surprises handled.</p>
      </div>
      <button type="button" class="cta" id="cta">Keep me posted &rarr;</button>
    </div>
  </div>

  <!--
    The address goes to Formspree. If that POST fails the person's own mail app opens instead,
    so a form that shows "Noted" can never have delivered nowhere.
  -->
  <form class="form" id="form" data-endpoint="https://formspree.io/f/xbgjzdrg" data-mailto="hello@keeper.gifts">
    <label class="sr-only" for="email" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Your email</label>
    <input id="email" type="email" name="email" placeholder="Your email" required autocomplete="email" inputmode="email">
    <button type="submit">Keep me posted</button>
  </form>
  <div class="noted" id="noted" hidden>Noted. You&rsquo;ll hear from us once, when it&rsquo;s ready.</div>
  <p class="line">Free. No plan to pick, no card to add.</p>
</main>

<footer>
  <span>&copy; 2026 Keeper Pty Ltd</span>
  <a href="mailto:hello@keeper.gifts">hello@keeper.gifts</a>
</footer>

<script>
/*
 * The scenes. One word after KEEP wherever one word will do; the closer takes two and carries
 * the tagline. Order is the order the founder drew them in.
 */
const SCENES = [
  { word: 'her.' },
  { word: 'him.' },
  { word: 'mum happy.' },
  { word: 'your mates close.', compact: true },
  { word: 'your team valued.', compact: true },
  { word: 'your clients.', compact: true },
  { word: 'your people.', tag: true },
]
const TYPE_MS = 85, ERASE_MS = 38, HOLD_MS = 1700, HOLD_LAST_MS = 3400, GAP_MS = 260

const typed = document.getElementById('typed')
const who = document.getElementById('who')
const tag = document.getElementById('tag')
const imgs = [...document.querySelectorAll('.screen img')]
const dots = document.getElementById('dots')
const still = matchMedia('(prefers-reduced-motion: reduce)').matches

SCENES.forEach((_, i) => {
  const b = document.createElement('button')
  b.type = 'button'
  b.addEventListener('click', () => jump(i))
  dots.appendChild(b)
})
const dotEls = [...dots.children]
const fit = () => { dots.style.width = document.getElementById('word').getBoundingClientRect().width + 'px' }
fit(); addEventListener('resize', fit); document.fonts.ready.then(fit)

const wait = (ms) => new Promise((r) => setTimeout(r, ms))
let current = 0, run = 0

const show = (i) => {
  imgs.forEach((img) => img.classList.toggle('on', Number(img.dataset.scene) === i))
  dotEls.forEach((d, k) => d.classList.toggle('on', k === i))
  who.classList.toggle('two', SCENES[i].word.includes(' ') && !SCENES[i].compact)
  who.classList.toggle('compact', Boolean(SCENES[i].compact))
  tag.classList.toggle('on', Boolean(SCENES[i].tag))
}

const play = async (token) => {
  while (token === run) {
    const scene = SCENES[current]
    show(current)
    if (still) {
      typed.textContent = scene.word
      await wait(scene.tag ? HOLD_LAST_MS : HOLD_MS)
    } else {
      typed.textContent = ''
      for (const ch of scene.word) {
        if (token !== run) return
        typed.textContent += ch
        await wait(TYPE_MS)
      }
      await wait(scene.tag ? HOLD_LAST_MS : HOLD_MS)
      while (typed.textContent.length && token === run) {
        typed.textContent = typed.textContent.slice(0, -1)
        await wait(ERASE_MS)
      }
      if (token !== run) return
      tag.classList.remove('on')
      await wait(GAP_MS)
    }
    if (token !== run) return
    current = (current + 1) % SCENES.length
  }
}

const jump = (i) => { current = i; run += 1; play(run) }
play(run)

/* The phone's button and the form under it are the same ask. */
document.getElementById('cta').addEventListener('click', () => {
  const input = document.getElementById('email')
  input.scrollIntoView({ behavior: 'smooth', block: 'center' })
  input.focus({ preventScroll: true })
})

const form = document.getElementById('form')
form.addEventListener('submit', async (event) => {
  event.preventDefault()
  const email = form.querySelector('input[type=email]').value.trim()
  if (!email) return
  const done = () => { form.hidden = true; document.getElementById('noted').hidden = false }
  try {
    const res = await fetch(form.dataset.endpoint, {
      method: 'POST',
      headers: { 'content-type': 'application/json', accept: 'application/json' },
      body: JSON.stringify({ email, source: 'keeper.gifts' }),
    })
    if (res.ok) return done()
  } catch (_) { /* fall through to mail */ }
  const subject = encodeURIComponent('Keep me posted')
  const body = encodeURIComponent(`Please let me know when keeper is ready. ${email}`)
  window.location.href = `mailto:${form.dataset.mailto}?subject=${subject}&body=${body}`
  done()
})
</script>
</body>
</html>
